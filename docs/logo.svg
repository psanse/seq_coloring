<svg xmlns="http://www.w3.org/2000/svg" width="720" height="220" viewBox="0 0 720 220" role="img" aria-labelledby="t d">
  <title id="t">seq_coloring</title>
  <desc id="d">A small graph whose vertices are colored with three colors, next to the project name.</desc>
  <rect width="720" height="220" rx="22" fill="#0f172a"/>

  <!-- edges -->
  <g stroke="#64748b" stroke-width="5" stroke-linecap="round">
    <line x1="48"  y1="122" x2="112" y2="66"/>
    <line x1="112" y1="66"  x2="212" y2="66"/>
    <line x1="212" y1="66"  x2="162" y2="156"/>
    <line x1="112" y1="66"  x2="162" y2="156"/>
  </g>

  <!-- vertices, colored as SEQ does: 0->1, 1->2, 2->1, 3->3, 4->1 -->
  <g stroke="#0f172a" stroke-width="4" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">
    <circle cx="48"  cy="122" r="24" fill="#38bdf8"/>
    <circle cx="112" cy="66"  r="24" fill="#fb7185"/>
    <circle cx="212" cy="66"  r="24" fill="#38bdf8"/>
    <circle cx="162" cy="156" r="24" fill="#fbbf24"/>
    <circle cx="246" cy="160" r="24" fill="#38bdf8"/>
  </g>
  <g fill="#0f172a" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">
    <text x="48"  y="129">1</text>
    <text x="112" y="73">2</text>
    <text x="212" y="73">1</text>
    <text x="162" y="163">3</text>
    <text x="246" y="167">1</text>
  </g>

  <!-- title -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="312" y="104" font-size="52" font-weight="700" fill="#f8fafc">seq_coloring</text>
    <text x="314" y="140" font-size="19" fill="#94a3b8">Greedy sequential vertex coloring heuristics</text>
    <text x="314" y="170" font-size="15" fill="#64748b" letter-spacing="1.5">SEQ  ·  ISEQ  ·  C++14  ·  BitGraph</text>
  </g>
</svg>
